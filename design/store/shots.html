<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: JBM; src: url(fonts/JetBrainsMono-Regular.ttf); font-weight: 400; }
@font-face { font-family: JBM; src: url(fonts/JetBrainsMono-Bold.ttf); font-weight: 700; }
@font-face { font-family: NGC; src: url(fonts/NanumGothicCoding-Regular.ttf); font-weight: 400; }
@font-face { font-family: NGC; src: url(fonts/NanumGothicCoding-Bold.ttf); font-weight: 700; }
@font-face { font-family: NSK; src: url(fonts/NotoSansKR.ttf); font-weight: 100 900; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #0C0C0C; overflow: hidden; }
.ko { word-spacing: -0.3em; }
.canvas { position: relative; overflow: hidden; background: radial-gradient(120% 70% at 50% 0%, #12201f 0%, #0C0C0C 60%); }
.cap { position: absolute; left: 0; right: 0; text-align: center; color: #F2F2F2; font-family: JBM, NGC, monospace; }
.cap .p { color: #A3A3A3; }
.cap .p b { color: #61D6D6; font-weight: 400; }
.cap .t { font-weight: 700; letter-spacing: -0.5px; word-spacing: -0.25em; }
.cap .s { color: #A3A3A3; word-spacing: -0.25em; }
.frame { position: absolute; background: #1b1b1b; border: 1px solid #3a3a3a; box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 0 0 2px #0a0a0a; }
.screen { position: absolute; overflow: hidden; background: #000; }
.app { position: absolute; left: 0; top: 0; transform-origin: top left; font-family: JBM, NGC, monospace; line-height: 1.5; display: flex; flex-direction: column; }
.row { display: flex; align-items: center; }
.dash { height: 1px; background-image: linear-gradient(90deg, var(--line) 0 4px, transparent 4px 7px); background-size: 7px 1px; }
.btn { height: 44px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); font-size: 13px; }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const P = {
  cmd:   { bg:'#0C0C0C', bar:'#1A1A1A', fg:'#CCCCCC', hi:'#F2F2F2', dim:'#A3A3A3', tag:'#F9F1A5', cmd:'#61D6D6', warn:'#E74856', line:'#2A2A2A', light:false },
  light: { bg:'#F5F2E8', bar:'#E8E4D6', fg:'#2B2B2B', hi:'#111111', dim:'#6B6B6B', tag:'#7A5F00', cmd:'#0B6E8A', warn:'#C0282F', line:'#D6D1C2', light:true },
};
const q = new URLSearchParams(location.search);
const device = q.get('device') || 'iphone';
const shot = q.get('shot') || '1';
const IP = device === 'iphone';
const C = IP ? { w:440, h:956, appW:390, appH:844, frameTop:178, screenW:350, bezel:8, rFrame:58, rScreen:50, statusH:47, homeH:34,
                 capTop:52, pSize:13, tSize:33, sSize:14 }
             : { w:1032, h:1376, appW:680, appH:907, frameTop:290, screenW:760, bezel:14, rFrame:40, rScreen:26, statusH:24, homeH:20,
                 capTop:80, pSize:20, tSize:54, sSize:22 };
if (IP && q.get('size') === '65') Object.assign(C, { w:428, h:926, frameTop:170, screenW:338, capTop:48 });
C.screenH = Math.round(C.screenW * C.appH / C.appW);

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const promptIcon = c => `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="${c}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5 6 8l-3.5 3.5"/><path d="M8 12h5.5"/></svg>`;

let DAY = ['10.01 목', '10월 1일 (목)'];
function statusBar(c, bg) {
  const batt = `<svg width="${IP?26:24}" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="${c}" opacity=".5"/><rect x="2" y="2" width="16" height="8" rx="1.5" fill="${c}"/><rect x="23.5" y="4" width="1.5" height="4" rx=".7" fill="${c}" opacity=".5"/></svg>`;
  return `<div class="row" style="height:${C.statusH}px;background:${bg};padding:${IP?'14px 30px 0 36px':'0 20px'};justify-content:space-between;font-family:NSK,sans-serif;font-weight:600;font-size:${IP?16:13}px;color:${c}">
    <span>00:07</span><span class="row" style="gap:6px">${IP?'':`<span style="font-weight:500">${DAY[1]}</span>`}${batt}</span></div>`;
}
function titleBar(p, tabs, active) {
  const tab = l => `<div class="row" style="height:44px;padding:0 10px;font-size:13px;${l===active?`background:${p.fg};color:${p.bg}`:`color:${p.dim}`}">${l}</div>`;
  return `<div style="background:${p.bar};border-bottom:1px solid ${p.line}">${statusBar(p.hi, p.bar)}
    <div class="row" style="height:44px;padding:0 4px 0 14px;gap:8px">${promptIcon(p.hi)}
      <span style="font-size:13px;color:${p.hi}">ink.exe</span><span style="font-size:12px;color:${p.dim};flex:1">${DAY[0]}</span>${tabs.map(tab).join('')}</div></div>`;
}
const prompt = (p, cmd) => `<div style="font-size:14px"><span style="color:${p.dim}">C:\\ink&gt; </span><span style="color:${p.cmd}">${cmd}</span></div>`;
const wide = (p, k, l, filled) => `<div class="row" style="height:52px;border:1px solid ${filled?p.cmd:p.fg};${filled?`background:${p.cmd};`:''}justify-content:center;gap:12px;font-size:15px"><span style="color:${filled?p.bg:p.dim}">${k}</span><span style="color:${filled?p.bg:p.hi}">${l}</span></div>`;

const ENTRIES = [
  [1,'guest_0412','00:00','original','파란 잎이 떨어질 때마다 할머니는 그 잎에 이름을 붙였다. 오늘은 내 차례였다. 나는 한참을 고민하다가 할머니의 이름을 붙였다.',17,true],
  [2,'guest_2291','00:00','quote','새는 알에서 나오려고 투쟁한다. 알은 세계이다. 태어나려는 자는 하나의 세계를 깨뜨려야 한다.',12,false,'데미안','헤르만 헤세'],
  [3,'guest_8830','00:01','original','편의점 앞 가로수에 누가 파란 페인트를 칠해 놓았다. 경찰은 범인을 찾지 못했고, 나는 찾고 싶지 않았다.',9,false],
  [4,'guest_1903','00:02','original','뿌리는 기억을 먹고 자란다. 그래서 오래된 나무일수록 푸르다.',21,false],
  [5,'guest_7730','00:03','original','나는 그 나무를 그리려고 물감을 샀는데, 파란색만 다 떨어져 있었다.',6,false,null,null,true],
  [6,'guest_0556','00:04','original','파란 나무는 슬플 때만 보인다고 했다. 그날 나는 숲 전체가 파랗게 보였다.',14,false],
  [7,'guest_3308','00:05','original','우리 동네에는 사계절 내내 파란 나무가 한 그루 있다. 모두 그 나무를 모른 척한다.',4,false],
  [8,'guest_4410','00:06','original','할 말이 많은 날엔 나무에게 먼저 말해 본다. 나무는 한 번도 끊지 않았다.',8,false],
];

function entry(p, e) {
  const [n, nick, time, kind, body, likes, liked, t, a, mine] = e;
  return `<div style="padding:8px 0;border-bottom:1px solid ${p.line};${mine?`background:${p.cmd}${p.light?'12':'16'};`:''}">
    <div class="row" style="font-size:12px;gap:8px">
      <span style="color:${p.dim}">#${String(n).padStart(2,'0')}</span>
      <span style="color:${mine?p.cmd:p.fg}">${nick}${mine?' (나)':''}</span>
      <span style="color:${p.dim}">${time}</span>
      ${kind==='quote'?`<span style="color:${p.tag}">[인용]</span>`:''}
      <span style="flex:1"></span>
      <span class="row" style="min-width:52px;height:36px;justify-content:center;padding:0 8px;border:1px solid ${liked?p.cmd:p.line};${liked?`background:${p.cmd};color:${p.bg}`:`color:${p.cmd}`}">+${likes}</span>
      <span class="row" style="width:40px;height:36px;justify-content:center;color:${p.dim};font-size:16px">⋯</span>
    </div>
    <div class="ko clamp2" style="margin-top:4px;font-size:14px;line-height:1.6;color:${p.hi}">${esc(body)}</div>
    ${kind==='quote'?`<div class="ko" style="margin-top:2px;font-size:12px;color:${p.tag}">— 『${t}』, ${a}</div>`:''}
  </div>`;
}

function boardScreen(p, o) {
  const count = o.count, cap = 20, cells = Math.round(count*10/cap), full = count >= cap;
  const list = (o.entries || ENTRIES.slice(0, IP ? 6 : 8)).map(e => entry(p, e)).join('');
  const footer = full
    ? `<div style="color:${p.warn};font-weight:700;font-size:14px">Server is full.</div><div class="ko" style="font-size:13px;color:${p.fg}">오늘 20자리가 모두 찼어요. 다음 글감까지 ${o.clock}</div>`
    : o.posted
    ? `<div class="row ko" style="min-height:48px;padding:0 12px;border:1px solid ${p.line};background:${p.bg};font-size:13px;color:${p.fg}">✓ 오늘 #05 에 올렸어요 · 다음 글감까지 ${o.clock}</div>`
    : `<div class="ko" style="font-size:12px;color:${p.dim}">내 자리 #${String(count+1).padStart(2,'0')} · 남은 자리 ${cap-count} · 마감까지 ${o.clock}</div><div style="margin-top:6px">${wide(p,'[ ENTER ]','쓰기')}</div>`;
  return `<div class="app" style="width:${C.appW}px;height:${C.appH}px;background:${p.bg};color:${p.fg}">
    ${titleBar(p, ['hall','log','규칙'])}
    <div style="flex:1;min-height:0;overflow:hidden;padding:14px 16px 0">
      <div style="color:${p.hi};font-size:14px">INK [오늘의 글감]</div>
      <div class="ko" style="color:${p.dim};font-size:13px">익명 · 하루 한 편 · 선착순 20명 · 자정에 새 글감</div>
      <div style="margin-top:14px">${prompt(p,'topic')}</div>
      <div class="ko" style="font-size:26px;font-weight:700;color:${p.hi};line-height:1.3;margin-top:2px">${o.topic || '파란 나무'}</div>
      <div class="row" style="gap:10px;margin-top:10px;font-size:13px"><span style="color:${p.dim}">접속</span><span style="color:${full?p.warn:p.cmd}">[${'█'.repeat(cells)}${'░'.repeat(10-cells)}]</span><span style="color:${p.hi}">${count}/${cap}</span><span style="color:${full?p.warn:p.dim}">${full?'FULL':'남은 자리 '+(cap-count)}</span></div>
      <div class="dash" style="--line:${p.line};margin-top:10px"></div>
      ${list}
    </div>
    <div style="background:${p.bar};border-top:1px solid ${p.line};padding:10px 16px ${12+C.homeH}px">
      ${o.notice?`<div class="ko" style="font-size:13px;color:${p.cmd};margin-bottom:6px">${o.notice}</div>`:''}${footer}</div>
  </div>`;
}

function writeScreen(p) {
  const field = (ph, val, flex) => `<div style="flex:${flex};height:44px;border:1px solid ${val?p.line:p.line};padding:0 12px;display:flex;align-items:center;font-size:15px;color:${val?p.hi:p.dim}" class="ko">${val||ph}</div>`;
  const body = '새는 알에서 나오려고 투쟁한다. 알은 세계이다. 태어나려는 자는 하나의 세계를 깨뜨려야 한다.';
  return `<div class="app" style="width:${C.appW}px;height:${C.appH}px;background:${p.bg};color:${p.fg}">
    ${titleBar(p, ['write'], 'write')}
    <div style="flex:1;min-height:0;overflow:hidden;padding:14px 16px 0">
      ${prompt(p,'write #09')}
      <div style="font-size:12px;color:${p.dim};margin-top:4px">글감</div>
      <div class="ko" style="font-size:22px;font-weight:700;color:${p.hi}">깨지는 것</div>
      <div class="row" style="gap:8px;margin-top:14px"><span class="btn" style="--line:${p.line};color:${p.fg}">창작</span><span class="btn" style="--line:${p.fg};background:${p.fg};color:${p.bg}">인용</span></div>
      <div class="ko" style="margin-top:10px;font-size:12px;color:${p.dim}">좋아하는 작품의 한 구절이면 출처를 꼭 적어 주세요.</div>
      <div class="row" style="gap:8px;margin-top:8px">${field('작품명','데미안',3)}${field('작가','헤르만 헤세',2)}</div>
      <div style="margin-top:8px;border:1px solid ${p.cmd};padding:12px;min-height:${IP?260:300}px;font-size:15px;line-height:1.6;color:${p.hi}" class="ko">${body}<span style="display:inline-block;width:2px;height:18px;background:${p.cmd};vertical-align:middle;margin-left:1px"></span></div>
      <div class="row" style="margin-top:6px;font-size:12px"><span class="ko" style="flex:1;color:${p.dim}">인용도 출처와 함께 명예의 전당에 오를 수 있어요.</span><span style="color:${p.dim}">${[...body].length}/300</span></div>
    </div>
    <div style="padding:8px 16px ${16+C.homeH}px">${wide(p,'[ ENTER ]','올리기')}<div class="row" style="margin-top:8px;height:44px;border:1px solid ${p.line};justify-content:center;font-size:13px;color:${p.fg}">[ ESC ] 닫기</div></div>
  </div>`;
}

function hallScreen(p) {
  const card = (hdr, n, nick, body, likes, src) => `<div style="padding:8px 0;border-bottom:1px solid ${p.line}">
    <div class="ko" style="font-size:12px;color:${p.cmd}">${hdr}</div>
    <div class="row" style="font-size:12px;gap:8px;margin-top:2px"><span style="color:${p.dim}">#${n}</span><span style="color:${p.fg}">${nick}</span><span style="flex:1"></span><span style="color:${p.cmd}">+${likes}</span></div>
    <div class="ko" style="margin-top:4px;font-size:14px;line-height:1.6;color:${p.hi}">${esc(body)}</div>
    ${src?`<div class="ko" style="margin-top:2px;font-size:12px;color:${p.tag}">${src}</div>`:''}</div>`;
  const sec = (t, s) => `<div style="margin-top:18px"><div class="ko" style="font-size:14px;color:${p.hi}">${t}</div>${s?`<div class="ko" style="font-size:12px;color:${p.dim}">${s}</div>`:''}</div>`;
  return `<div class="app" style="width:${C.appW}px;height:${C.appH}px;background:${p.bg};color:${p.fg}">
    ${titleBar(p, ['hall','log','규칙'], 'hall')}
    <div style="flex:1;min-height:0;overflow:hidden;padding:14px 16px 0">
      ${prompt(p,'type hall.txt')}
      <div class="ko" style="font-size:22px;font-weight:700;color:${p.hi}">명예의 전당</div>
      <div class="ko" style="font-size:12px;color:${p.dim}">날마다 +1 1위 글이 이달 전당에 오르고, 달이 끝나면 그중 한 편만 남아요.</div>
      ${sec('오늘 지금 1위','자정에 확정돼요')}${card('11.04 수 · 비 오는 옥상','07','guest_9014','비가 그치면 우리는 옥상에 고인 물웅덩이에 하늘을 빌려 쓴다.',26)}
      ${sec('2026.11 · 날마다 1위')}
      ${card('11.03 화 · 잠긴 서랍','03','guest_5521','열쇠는 없었다. 대신 서랍 틈으로 누군가 매일 쪽지를 밀어 넣었다. 오늘 쪽지에는 “이제 열어도 돼”라고 쓰여 있었다.',38)}
      ${card('11.02 월 · 마지막 버스','11','guest_0087','마지막 버스는 늘 한 정거장을 더 갔다. 그 정거장의 이름은 노선도에 없었다.',31)}
      ${card('11.01 일 · 깨지는 것','05','guest_3318','새는 알에서 나오려고 투쟁한다. 알은 세계이다.',29,'— 『데미안』, 헤르만 헤세')}
      ${sec('이달의 1위','달마다 한 편, 영구 보관')}
      ${card('2026.10 · 10.01 목 · 파란 나무','04','guest_1903','뿌리는 기억을 먹고 자란다. 그래서 오래된 나무일수록 푸르다.',64)}
    </div>
    <div style="padding:8px 16px ${16+C.homeH}px">${wide(p,'[ ESC ]','게시판으로')}</div>
  </div>`;
}

function rulesScreen(p) {
  const rules = ['욕설 · 비방 · 혐오 · 성적인 글 금지','이름 · 연락처 · SNS 계정 등 개인정보 금지','광고 · 링크 · 도배 금지','다른 작품을 옮겨 적을 땐 작품명과 작가를 꼭 적기 (300자 이내)','신고가 3번 쌓인 글은 바로 가려지고, 24시간 안에 확인해 지워요','규칙을 어긴 기기는 쓰기가 막혀요'];
  return `<div class="app" style="width:${C.appW}px;height:${C.appH}px;background:${p.bg};color:${p.fg}">
    ${titleBar(p, [])}
    <div style="flex:1;min-height:0;overflow:hidden;padding:18px 16px 0">
      <div style="font-size:13px;color:${p.dim}">CONNECT 2400 ... <span style="color:${p.cmd}">OK</span></div>
      <div class="ko" style="margin-top:10px;font-size:18px;font-weight:700;color:${p.hi}">오늘의 글감 게시판</div>
      <div class="ko" style="margin-top:4px;font-size:13px;color:${p.dim}">매일 자정에 글감이 하나 열려요. 선착순 20명이 익명으로 한 편씩, 300자 안에 써요. 직접 쓴 글도, 좋아하는 소설의 한 구절도 좋아요.</div>
      <div style="margin-top:16px;padding:12px;border:1px solid ${p.line}"><div style="font-size:12px;color:${p.dim}">익명 이름</div><div style="font-size:18px;color:${p.cmd}">guest_7730</div><div class="ko" style="font-size:12px;color:${p.dim}">매일 자정에 새 이름이 붙어요. 가입 · 실명 · 연락처 없음.</div></div>
      <div style="margin-top:18px">${prompt(p,'type rules.txt')}</div>
      ${rules.map((r,i)=>`<div class="row" style="align-items:flex-start;gap:10px;margin-top:8px;font-size:13px"><span style="color:${p.cmd}">[${i+1}]</span><span class="ko" style="color:${p.fg}">${r}</span></div>`).join('')}
    </div>
    <div style="padding:8px 16px ${16+C.homeH}px">
      <div class="row" style="min-height:48px;gap:10px;font-size:13px"><span style="color:${p.cmd}">[x]</span><span class="ko" style="color:${p.fg}">위 규칙과 이용약관에 동의하고, 만 14세 이상이에요.</span></div>
      <div style="margin-top:8px">${wide(p,'[ ENTER ]','입장하기')}</div></div>
  </div>`;
}

const FULL = [...ENTRIES, ...ENTRIES.slice(0,4).map((e,i)=>[e[0]+8+i*3, 'guest_'+(6100+i*77), '00:0'+(7+i), e[3], e[4], e[5]-3, false, e[7], e[8]])];
const SHOTS = {
  1: { t:'자정마다 글감 하나', s:'선착순 20명 · 300자 · 익명', body:()=>boardScreen(P.cmd,{count:12, clock:'23:52:51'}) },
  2: { t:'창작이든, 좋아하는 구절이든', s:'[인용]은 작품명과 작가를 함께', body:()=>writeScreen(P.cmd) },
  3: { t:'매일 1위, 달마다 단 한 편', s:'명예의 전당에 영구 보관', body:()=>{DAY=['11.04 수','11월 4일 (수)']; return hallScreen(P.light);} },
  4: { t:'20자리가 차면 마감', s:'Server is full. 내일 00:00 새 글감', body:()=>boardScreen(P.cmd,{count:20, clock:'23:41:07', topic:'파란 나무', entries: IP?[ENTRIES[3],ENTRIES[5],ENTRIES[0],ENTRIES[1],ENTRIES[2]]:[ENTRIES[3],ENTRIES[5],ENTRIES[0],ENTRIES[1],ENTRIES[2],ENTRIES[7],ENTRIES[6]]}) },

};

const S = SHOTS[shot];
const scale = C.screenW / C.appW;
const frameW = C.screenW + C.bezel*2, frameH = C.screenH + C.bezel*2;
const inner = S.body().replace('class="app" style="', `class="app" style="transform:scale(${scale});`);
document.getElementById('root').innerHTML = `
<div class="canvas" style="width:${C.w}px;height:${C.h}px">
  <div class="cap" style="top:${C.capTop}px">
    <div class="p" style="font-size:${C.pSize}px"><b>&gt;_</b> C:\\ink&gt;</div>
    <div class="t" style="font-size:${C.tSize}px;margin-top:${IP?8:12}px">${S.t}</div>
    ${S.s?`<div class="s" style="font-size:${C.sSize}px;margin-top:${IP?8:12}px">${S.s}</div>`:''}
  </div>
  <div class="frame" style="left:${(C.w-frameW)/2}px;top:${C.frameTop}px;width:${frameW}px;height:${frameH}px;border-radius:${C.rFrame}px">
    <div class="screen" style="left:${C.bezel}px;top:${C.bezel}px;width:${C.screenW}px;height:${C.screenH}px;border-radius:${C.rScreen}px">${inner}</div>
  </div>
</div>`;
