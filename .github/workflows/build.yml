name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Prepare platform folders
        run: bash tool/setup_platforms.sh

      - name: Get packages
        run: flutter pub get

      - name: App icons
        run: dart run flutter_launcher_icons

      - name: Test
        run: flutter test --reporter github

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ink-exe-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Google Play 요건 (targetSdk 36 이상)
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          T=$("$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk | sed -n "s/^targetSdkVersion:'\([0-9]*\)'.*/\1/p")
          echo "targetSdk=$T"
          if [ "${T:-0}" -lt 36 ]; then echo "::error::targetSdk $T < 36 (Google Play 요건)"; exit 1; fi

      - name: Play 업로드 번들 (테스트 키로 서명되는지 확인)
        run: |
          printf 'ci-test-pw\nci-test-pw\n' | bash tool/setup_android_signing.sh
          flutter build appbundle --release
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | tee /tmp/cert.txt
          grep -q "CN=isla0x" /tmp/cert.txt || { echo "::error::번들이 업로드 키로 서명되지 않았어요"; exit 1; }

      # APK 가 먼저 나오도록 린트는 마지막에 돌린다.
      - name: Analyze
        run: |
          if ! out=$(flutter analyze --no-fatal-infos 2>&1); then
            echo "$out"
            echo "$out" | grep -E "(warning|error) •" | head -30 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          echo "$out"

  # 서버(Supabase) SQL: 빈 Postgres 에 스키마를 올리고 규칙 테스트를 돌린다.
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - name: Schema + tests
        run: bash supabase/test/run.sh

  # 펜네임 결제 확인 서버 함수 (가짜 Apple 인증서 체인으로 검사)
  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: claim-pen tests
        run: deno test --allow-net --allow-env --allow-read supabase/functions/claim-pen/test.ts

  # 진짜 iOS 빌드 (서명 없이). Xcode 프로젝트 · 위젯 타깃 · 플러그인이 함께 컴파일되는지 확인한다.
  ios-build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: App icons
        run: dart run flutter_launcher_icons

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
